<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Control de frecuencia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Control de frecuencia</h1>
    </div>
    <div class="status">
      <span id="connectionDot"></span>
      <span id="connectionText">En linea</span>
      <span class="badge" id="isolationBadge">revisando...</span>
    </div>
  </header>

  <main>
    <section class="toolbar card">
      <button id="startBtn">Iniciar</button>
      <button id="stopBtn" disabled>Parar</button>
      <button id="bunchBtn">Forzar bunching</button>
      <button id="offlineBtn">Simular offline</button>
      <label>Historial:
        <input id="historyRange" type="range" min="0" max="120" value="120">
      </label>
      <span id="historyLabel">En vivo</span>
    </section>

    <section class="layout">
      <div class="card mapCard">
        <div class="mapHeader">
          <strong>Mapa de flota</strong>
          <span id="busCount">0 buses</span>
        </div>
        <canvas id="mapCanvas"></canvas>
        <div class="legend"><span>Rutas y buses</span></div>
      </div>

      <aside class="side">
        <div class="card">
          <h2>Centro de control</h2>
          <div class="metrics">
            <div><b id="activeCount">0</b><small>buses activos</small></div>
            <div><b id="riskCount">0</b><small>alertas</small></div>
            <div><b id="gapCount">0</b><small>huecos</small></div>
            <div><b id="inpValue">--</b><small>INP / ms</small></div>
          </div>
        </div>

        <div class="card">
          <h2>Alertas</h2>
          <div id="alerts" class="list"></div>
        </div>

        <div class="card">
          <h2>Accion supervisor</h2>
          <p id="lastKnown">Ultimo estado: esperando...</p>
          <div class="actions">
            <button data-action="hold">Retener</button>
            <button data-action="empty">Bus vacio</button>
            <button data-action="incident">Incidente</button>
          </div>
          <p id="queueInfo">Cola offline: 0</p>
        </div>

      </aside>
    </section>

    <section class="card">
      <h2>Instrumentacion</h2>
      <div id="performanceLog" class="perf">
        <span>PerformanceObserver: esperando interaccion...</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
